name: Bash checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check-scripts:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Bash syntax
        run: |
          bash -n check_api.sh
          bash -n analyze_logs.sh

      - name: Test API availability
        run: ./check_api.sh https://httpbin.org/status/200
